name: Z23 compatibility, persistence and debugger

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang dpkg-dev \
            libsqlite3-dev libssl-dev libpq-dev libhiredis-dev \
            python3

      - name: Install Zumbra 0.14.5
        run: |
          curl -L --fail \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -o /tmp/zumbra.tar.gz \
            https://github.com/JoseLucasapp/Zumbra-lang/releases/download/v0.14.3/zumbra-0.14.3-linux-amd64.tar.gz
          mkdir -p "$HOME/.local/bin" /tmp/zumbra
          tar -xzf /tmp/zumbra.tar.gz --strip-components=1 -C /tmp/zumbra
          install -m 755 /tmp/zumbra/zumbra "$HOME/.local/bin/zumbra"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Zumbra 0.14.5 from source
        shell: bash
        run: |
          rm -rf /tmp/Zumbra-lang
          git clone --depth 1 --branch v0.14.5 https://github.com/JoseLucasapp/Zumbra-lang.git /tmp/Zumbra-lang
          cd /tmp/Zumbra-lang
          go build -o "$HOME/.local/bin/zumbra" .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/zumbra" --version
          test "$("$HOME/.local/bin/zumbra" --version)" = "0.14.5"

      - name: Run Z23 gate
        env:
          EXPECTED_ZUMBRA_VERSION: "0.14.5"
        run: ZUMBRA_BIN="$HOME/.local/bin/zumbra" EXPECTED_ZUMBRA_VERSION=0.14.5 scripts/test-z23-compatibility.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: zumbra-nes-0.5.29-linux-amd64
          path: |
            dist/*.deb
            dist/*.AppDir/**
            dist/*SHA256SUMS*.txt
            dist/*package-report.json
          if-no-files-found: error
