name: Z19 foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang \
            libsqlite3-dev libssl-dev libpq-dev libhiredis-dev

      - name: Install Zumbra 0.14.0
        run: |
          curl -L --fail \
            -o /tmp/zumbra.tar.gz \
            https://github.com/JoseLucasapp/Zumbra-lang/releases/download/v0.14.0/zumbra-0.14.0-linux-amd64.tar.gz
          mkdir -p "$HOME/.local/bin" /tmp/zumbra
          tar -xzf /tmp/zumbra.tar.gz --strip-components=1 -C /tmp/zumbra
          install -m 755 /tmp/zumbra/zumbra "$HOME/.local/bin/zumbra"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Z19 gate
        run: scripts/test-z19-foundation.sh
